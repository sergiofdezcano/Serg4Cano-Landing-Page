name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours: pull new videos and tweets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh videos and tweets
        run: npm run fetch
      - run: npm run build
      - name: Unit tests and data checks
        run: npm test
      - name: Browser tests (layout, accessibility, assets)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
